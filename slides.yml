# slides.yml — manifiesto del hub de presentaciones
#
# Fuente de verdad de los metadatos que muestra index.html.
# Lo escribe /slides al publicar y se puede editar a mano.
# Regenerar el hub:  python3 ~/.claude/commands/slides_assets/build_index.py
#
# Campos por entrada:
#   slug      (obligatorio) identificador; carpeta en decks/ o nombre del archivo legacy
#   title     (obligatorio) título que se muestra en el hub
#   date      YYYY-MM-DD de la presentación
#   kind      charla | conferencia | seminario | clase | policy | propuesta | otro
#   event     dónde se presentó (institución, congreso, curso)
#   lang      es | en
#   html      ruta relativa al HTML navegable (opcional)
#   pdf       ruta relativa al PDF descargable (opcional)
#   pptx      ruta relativa al PPTX descargable (opcional)
#   tags      lista de etiquetas temáticas
#   featured  true para destacarla arriba del hub
#   hidden    true para no listarla (el archivo sigue accesible por URL)
#   note      una línea de contexto que se muestra bajo el título
#
# Un archivo publicado que no tenga ficha aquí igual aparece en el hub con
# metadatos derivados del disco. Correr con --seed le escribe su ficha.

